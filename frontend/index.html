<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Quản Lý Dữ Liệu</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #2d2d2d; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #4da6ff; margin-bottom: 20px; }
        
        /* Cụm nút công cụ chính */
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        button { padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; width: 130px; transition: 0.2s; }
        button:hover { opacity: 0.8; transform: scale(1.02); }
        
        .btn-select { background-color: #007bff; }
        .btn-insert { background-color: #28a745; }
        .btn-update { background-color: #ffc107; color: black; }
        .btn-delete { background-color: #dc3545; }
        
        #statusMessage { text-align: center; margin-bottom: 15px; font-style: italic; color: #ffeb3b; height: 20px; }
        
        /* Bảng dữ liệu */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #3d3d3d; cursor: pointer; }
        th, td { border: 1px solid #555; padding: 12px; text-align: left; }
        th { background-color: #4da6ff; color: #1e1e1e; }
        tr:hover { background-color: #4f4f4f; }
        tr.selected-row { background-color: #007bff !important; color: white; font-weight: bold; }
        
        /* Hộp thoại Modal */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background-color: #2d2d2d; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); position: relative; }
        .modal-content h3 { margin-top: 0; color: #4da6ff; text-align: center; margin-bottom: 20px; }
        .close-btn { position: absolute; top: 10px; right: 15px; color: #aaa; font-size: 24px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: white; }
        
        /* Form trong Modal */
        .modal input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #555; border-radius: 4px; background: #3d3d3d; color: white; box-sizing: border-box; }
        .modal input::placeholder { color: #aaa; }
        .modal-btn-group { display: flex; justify-content: center; }
        .modal-btn-group button { width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trình Quản Lý Dữ Liệu</h2>
    
    <!-- 4 Nút Công Cụ -->
    <div class="toolbar">
        <button class="btn-select" onclick="openModal('SELECT')">🔍 SELECT</button>
        <button class="btn-insert" onclick="openModal('INSERT')">➕ INSERT</button>
        <button class="btn-update" onclick="openModal('UPDATE')">✏️ UPDATE</button>
        <button class="btn-delete" onclick="executeDelete()">🗑️ DELETE</button>
    </div>

    <div id="statusMessage">Hãy bấm vào một dòng trong bảng để chọn...</div>

    <!-- Khu vực Bảng hiển thị dữ liệu -->
    <table>
        <thead>
            <tr>
                <th>Mã số</th>
                <th>Tên</th>
                <th>Địa chỉ</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dữ liệu sẽ hiển thị ở đây -->
        </tbody>
    </table>
</div>

<!-- GIAO DIỆN HỘP THOẠI (MODAL) DÙNG CHUNG -->
<div id="myModal" class="modal">
        <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Tiêu đề Modal</h3>

        <input type="text" id="m_id" placeholder="Nhập Mã số...">
        <input type="text" id="m_name" placeholder="Nhập Tên...">
        <!-- Đổi type thành text cho Địa chỉ -->
        <input type="text" id="m_address" placeholder="Nhập Địa chỉ...">
        
        <div class="modal-btn-group">
            <button id="modalSubmitBtn" onclick="submitModal()">Xác nhận</button>
        </div>
    </div>
</div>

<script>
    // API BASE URL - relative nên cùng nguồn với Flask (backend tự phục vụ frontend)
    const API_URL = "/api/students";

    let students = [];
    let selectedId = null;
    let currentMode = '';

    // -----------------------------------------
    // HÀM GỌI API (BACKEND)
    // -----------------------------------------
    async function apiRequest(url, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);

        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
            throw new Error(data.error || `Lỗi API (${res.status})`);
        }
        return data;
    }

    // Lấy danh sách sinh viên từ backend
    async function fetchStudents(params = {}) {
        const qs = new URLSearchParams(params).toString();
        const url = qs ? `${API_URL}?${qs}` : API_URL;
        students = await apiRequest(url);
        renderTable(students);
        return students;
    }

    // -----------------------------------------
    // HÀM HIỂN THỊ DỮ LIỆU & CHỌN DÒNG
    // -----------------------------------------
    function renderTable(dataList) {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        dataList.forEach(st => {
            const isSelected = st.MaSo === selectedId ? "selected-row" : "";
            tbody.innerHTML += `
                <tr class="${isSelected}" onclick="selectRow('${st.MaSo}')">
                    <td>${st.MaSo}</td>
                    <td>${st.HoTen}</td>
                    <td>${st.DiaChi || ''}</td>
                </tr>`;
        });
    }

    function selectRow(id) {
        const newSel = selectedId === id ? null : id;
        const message = document.getElementById("statusMessage");
        if (newSel && !students.some(s => s.MaSo === newSel)) {
            message.innerText = 'Không tìm thấy dữ liệu đã chọn (có thể đã bị xóa).';
            return;
        }
        selectedId = newSel;
        message.innerText = selectedId
            ? `Đang chọn dữ liệu có Mã số = ${selectedId}`
            : 'Đã bỏ chọn.';
        renderTable(students);
    }

    function showStatus(message) {
        document.getElementById("statusMessage").innerText = message;
    }

    // -----------------------------------------
    // XỬ LÝ HỘP THOẠI (MODAL)
    // -----------------------------------------
    function openModal(mode) {
        currentMode = mode;
        const modal = document.getElementById("myModal");
        const title = document.getElementById("modalTitle");
        const btn = document.getElementById("modalSubmitBtn");

        const inId = document.getElementById("m_id");
        const inName = document.getElementById("m_name");
        const inAddress = document.getElementById("m_address");

        inId.value = ""; inName.value = ""; inAddress.value = "";
        inId.style.display = "none"; inName.style.display = "none"; inAddress.style.display = "none";

        if (mode === 'INSERT') {
            title.innerText = "Thêm Dữ Liệu Mới";
            inId.style.display = "block";
            inName.style.display = "block";
            inAddress.style.display = "block";
            btn.innerText = "Thực hiện INSERT";
            btn.className = "btn-insert";
            modal.style.display = "flex";
        }
        else if (mode === 'UPDATE') {
            if (!selectedId) {
                alert("Vui lòng click vào 1 dòng trong bảng để chọn trước khi UPDATE!");
                return;
            }
            const st = students.find(s => s.MaSo === selectedId);
            title.innerText = `Cập nhật Mã số = ${selectedId}`;
            inName.style.display = "block"; inName.value = st.HoTen;
            inAddress.style.display = "block"; inAddress.value = st.DiaChi || "";
            btn.innerText = "Lưu UPDATE";
            btn.className = "btn-update";
            modal.style.display = "flex";
        }
        else if (mode === 'SELECT') {
            title.innerText = "Tìm Kiếm (Bỏ trống để tìm tất cả)";
            inId.style.display = "block";
            inName.style.display = "block";
            btn.innerText = "Thực hiện SELECT";
            btn.className = "btn-select";
            modal.style.display = "flex";
        }
    }

    function closeModal() {
        document.getElementById("myModal").style.display = "none";
    }

    // Nút xác nhận bên trong Modal
    async function submitModal() {
        const inId = document.getElementById("m_id");
        const inName = document.getElementById("m_name");
        const inAddress = document.getElementById("m_address");

        try {
            if (currentMode === 'INSERT') {
                const maso = inId.value.trim();
                const name = inName.value.trim();
                const address = inAddress.value.trim();
                if (!maso || !name) return alert("Vui lòng nhập đầy đủ Mã số và Tên!");

                await apiRequest(API_URL, 'POST', { maso, hoten: name, diachi: address });
                showStatus(`Đã thêm dữ liệu Mã số ${maso}.`);
                selectedId = null;
                await fetchStudents();
                closeModal();
            }
            else if (currentMode === 'UPDATE') {
                const newName = inName.value.trim();
                const newAddress = inAddress.value.trim();
                if (!newName && !newAddress) return alert("Không có gì thay đổi!");

                await apiRequest(`${API_URL}/${selectedId}`, 'PUT', { hoten: newName, diachi: newAddress });
                showStatus(`Cập nhật Mã số ${selectedId} thành công.`);
                await fetchStudents();
                closeModal();
            }
            else if (currentMode === 'SELECT') {
                const id = inId.value.trim();
                const name = inName.value.trim();
                await fetchStudents({ maso: id, hoten: name });
                showStatus(`Tìm thấy ${students.length} kết quả.`);
                selectedId = null;
                closeModal();
            }
        } catch (err) {
            alert(err.message);
        }
    }

    // -----------------------------------------
    // LỆNH DELETE (Xóa trực tiếp không cần Modal)
    // -----------------------------------------
    async function executeDelete() {
        if (!selectedId) {
            alert("Vui lòng click vào 1 dòng trong bảng để chọn trước khi DELETE!");
            return;
        }
        if (confirm(`Bạn có chắc chắn muốn xóa dữ liệu có Mã số = ${selectedId}?`)) {
            try {
                await apiRequest(`${API_URL}/${selectedId}`, 'DELETE');
                showStatus(`Đã xóa Mã số ${selectedId}.`);
                selectedId = null;
                await fetchStudents();
            } catch (err) {
                alert(err.message);
            }
        }
    }

        // Chạy khi vừa mở trang: lấy dữ liệu từ backend
    fetchStudents().catch(err => {
        showStatus('Không thể kết nối backend. Hãy chắc chắn đã chạy: py backend/app.py');
        console.error(err);
    });
</script>

</body>
</html>
